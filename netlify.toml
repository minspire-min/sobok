[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/admin-mingminjimin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# 기본적인 보안 헤더 — 이전엔 전혀 없었음. script-src에 unsafe-inline이 들어가는 건, Vite
# 개발 서버(netlify dev/vite dev)가 React Fast Refresh용 인라인 스크립트를 주입하는데 그걸
# 막으면 로컬 개발 자체가 깨지기 때문(운영 빌드엔 이 인라인 스크립트가 없음). style도 바
# 차트 컴포넌트들이 style={{...}}로 인라인 스타일을 많이 써서 unsafe-inline이 필요.
# → script/style은 느슨하지만, frame-ancestors(클릭재킹 방지)·connect-src·default-src는
# 그대로 제한해 핵심 보호는 유지한다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'"

# react-router(클라이언트 라우팅) 경로를 새로고침·직접 접속해도 index.html로 떨어지게 한다.
# /api/* 는 netlify/functions의 각 Config.path가 더 구체적인 경로라 먼저 매칭되므로 안 가려진다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
